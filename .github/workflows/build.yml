name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android (debug)
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake build-essential ccache

      - name: Instalar Buildozer e Cython
        run: |
          python -m pip install --upgrade pip
          pip install "Cython<3.0" virtualenv buildozer

      - name: Compilar APK (debug)
        run: yes | buildozer -v android debug

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nfc-scanner-apk
          path: bin/*.apk
          if-no-files-found: error
